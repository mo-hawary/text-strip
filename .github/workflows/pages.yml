# Deploys the showcase page in site/ to GitHub Pages, with the built library copied to _site/dist/.
#
# One-time setup: in the repo settings, open Pages and set "Source" to "GitHub Actions".
# Until that is set, the deploy job fails.

name: Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'site/**'
      - 'skills/**'
      - 'AGENTS.md'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R dist _site/dist
          cp llms.txt llms-full.txt _site/
          cp site/index.md _site/index.md
          mkdir -p _site/skills
          cp -R skills/. _site/skills/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
