# Release workflow for the npm package.
#
# Publishing only happens when a maintainer pushes a `v*` tag (for example
# `git tag v0.1.0 && git push origin v0.1.0`) and the NPM_TOKEN repository
# secret is set. Before anything is published, the job checks that the tagged
# commit is on main, that the tag matches the version in package.json, and
# that the full verification suite passes on that commit (typecheck, unit
# tests, build, size budgets and the Playwright end-to-end tests).
# A manual workflow_dispatch run runs the full suite but does not publish.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Commit $GITHUB_SHA is not on main. Only tags on main can be published." >&2
            exit 1
          fi

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version." >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run check

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:e2e

      - name: Check whether this version is already on npm
        id: published
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "text-strip@$VERSION" version >/dev/null 2>&1; then
            echo "text-strip@$VERSION is already on npm; skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: github.event_name == 'push' && steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
