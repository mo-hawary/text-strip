name: Feature request
description: Suggest a new option or behavior
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        text-strip has a strict size budget: the library stays about 4 KB gzip, and the library has zero runtime dependencies. New features must justify their bytes. Requests that add weight or dependencies are still welcome to discuss, but they need a strong reason.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like text-strip to do? If it is an option, describe its name, type and default.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Have you tried other approaches, such as custom CSS on your site or a different library?
    validations:
      required: false

  - type: checkboxes
    id: budget
    attributes:
      label: Size budget
      description: Please confirm you understand the size limit.
      options:
        - label: I understand the library must stay about 4 KB gzip, so the proposal may need to be trimmed to fit.
          required: true
