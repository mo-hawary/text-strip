<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="style-src 'self'; require-trusted-types-for 'script'" />
    <title>text-strip CSP demo</title>
  </head>
  <body>
    <main>
      <p>The strip must render under a style-src 'self' policy and Trusted Types enforcement.</p>
    </main>
    <script src="/dist/index.global.js"></script>
    <script>
      window.csp_strip = TextStrip.create({
        textArray: [
          'Strict CSP strip: this announcement is long enough to be wider than a desktop viewport, so the loop keeps running under the policy. ' +
          'It repeats the same sentence on purpose so the track never waits for a second group. ' +
          'Keeping the text longer than a desktop viewport keeps the loop running under the policy.',
        ],
        stripBgColor: '#111111',
        textColor: '#ffffff',
      });
    </script>
  </body>
</html>
