<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">text-strip</title>
  <desc id="d">Drop-in scrolling announcement bar. LTR and RTL, Arabic-first.</desc>
  <style>
    .title { font: 700 76px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #E6EDF3; }
    .tagline { font: 400 22px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #8B949E; }
    .en { font: 700 18px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #0D1117; text-anchor: middle; }
    .ar { font: 700 18px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #F59E0B; text-anchor: middle; }
    .en-dot { font: 700 18px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #0D1117; text-anchor: middle; }
    .ar-dot { font: 700 18px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #F59E0B; text-anchor: middle; }
    .track-en { animation: scroll-en-rtl 24s linear infinite; }
    .track-ar { animation: scroll-ar-ltr 24s linear infinite; }
    @keyframes scroll-en-rtl { from { transform: translateX(0); } to { transform: translateX(-2520px); } }
    @keyframes scroll-ar-ltr { from { transform: translateX(-2520px); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .track-en, .track-ar { animation: none; }
    }
  </style>
  <rect width="1280" height="320" fill="#0D1117"/>
  <text class="title" x="640" y="118" text-anchor="middle">text-strip</text>
  <text class="tagline" x="640" y="162" text-anchor="middle">Drop-in scrolling announcement bar. LTR and RTL, Arabic-first.</text>
  <g>
